# Per-element colour features from the screenshot crop -> data/processed/colour_features.parquet (git-ignored)
# Run: python scripts/extract_colour_features.py --config configs/colour_features.yaml
data_dir: data/processed
image_dir: data/raw/rico/combined
splits: [train, dev, test]   # clean splits; dropped screens are not needed
strip_px: 2                  # border strip width at 540 px wide (~ 3-4 px at 1080, as in the nesting-input measurements)
ring_px: 4                   # ring just outside the box for ring_contrast
workers: 16
seed: 0
