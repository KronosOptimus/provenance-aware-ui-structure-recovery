# Web-trained versions of the provenance-aware network vs the Android-only network.
#   python scripts/train_web_only_and_joint_android_web_networks.py --config configs/train_web_only_and_joint_android_web_networks.yaml --stage <fetch|build|embed|train|dev|test>
# Every setting below was fixed before any result of these networks was looked at.
web_test_config: configs/evaluate_android_system_on_web_pages.yaml        # web inputs: devices, levels, corruption seed, flags, rule baselines
fusion_config: configs/train_trust_score_on_corrupted_metadata.yaml       # Android data, network settings (Model 4's trial), threshold grid

# ---- paths (Colab); `laptop` / `smoke` blocks override them
raw_dir: /content/work/webui                  # page files of the three WebUI splits
zip_dir: /content/work/webui_zip              # one downloaded archive at a time, deleted after use
cache_dir: /content/work/web                  # built inputs and crop embeddings
out_dir: /content/drive/MyDrive/uistruct/web_train      # networks, threshold choices, test marker
runs_root: /content/drive/MyDrive/uistruct/runs
android_models_dir: /content/drive/MyDrive/uistruct/trust_score/models
download: true                                # whole archives (2-5 large requests each), not range reads
workers: null
fetch_threads: 4
seed: 0
n_boot: 1000

# ---- pages
test_pages: results/runs/web_test_run1/pages.csv     # the same 1,000 test pages as the web test
test_fingerprint: 0ff6f299116cbea5a123a1e5eda10b1cbc3d6c94892c245769eabd17d2c29561   # laptop build of those inputs
n_val_pages: 500                              # WebUI validation split (own websites): early stopping, thresholds
n_train_pages: null                           # null = every WebUI-7k page with both devices complete
train_corruption_seed: 14                     # Android train / dev / test used 10 / 11 / 12, web val / test 13

# ---- training: levels and draw weights as the Android network (real 0.5, heavy 0.3, absent 0.2); a web page's
# heavy level is drop + mask only (no web element is known to be wrong, so nothing to inject from)
levels_train_web: [real, heavy_noinject, absent]
level_weights: [0.5, 0.3, 0.2]
# select_levels: web validation levels whose pooled candidate AP picks the epoch. The web real level alone is circular
# (validation AP 0.997 from epoch 1: the true tree comes from the same page tree), so the web-only network selects on
# all three levels; the joint network keeps the Android network's rule (real level; its Android validation part decides)
regimes:
  web:   {android: false, trust: false, seeds: [0, 1, 2], select_levels: [real, drop50, absent]}
  joint: {android: true,  trust: true,  seeds: [0, 1, 2], select_levels: [real]}
android_models: [fusion_full_s0, fusion_full_s1, fusion_full_s2]     # the Android-only network, 3 seeds
android_test_run: results/runs/colab_trust_score/trust_score_test_run1/metrics.json   # its Android validation thresholds

# ---- paired comparisons (container F1 per page / screen, averaged over seeds)
pairs_web:
  - [web, fusion_full]
  - [joint, fusion_full]
  - [joint+trust, fusion_full+trust]
  - [joint, web]
  - [web, xycut]
  - [joint, xycut]
  - [joint+trust, joint]
  - [fusion_full, fusion_full@android_thr]
  - [web, raw_collapsed]
  - [joint+trust, raw_collapsed]
pairs_android:
  - [joint, fusion_full]
  - [joint+trust, fusion_full+trust]
  - [web, fusion_full]

laptop:
  raw_dir: data/raw/webui_train
  zip_dir: data/processed/webui_zip
  cache_dir: data/processed/web_train
  out_dir: data/processed/web_train/out
  runs_root: results/runs
  android_models_dir: data/processed/trust_score/out/models
  download: false
  workers: 6
  fetch_threads: 16

smoke:                                        # laptop code check on a few pages; not results
  raw_dir: data/processed/web_smoke/raw
  cache_dir: data/processed/web_smoke/cache
  out_dir: data/processed/web_smoke/out
  runs_root: data/processed/web_smoke/runs
  android_models_dir: data/processed/trust_score_smoke/out/models
  android_models: [fusion_full_s0, fusion_full_s1]
  n_train_pages: 10
  n_val_pages: 6
  n_test_pages: 6
  n_boot: 30
  workers: 4
  regimes:
    web:   {android: false, trust: false, seeds: [0], select_levels: [real, drop50, absent]}
    joint: {android: true,  trust: true,  seeds: [0], select_levels: [real]}
